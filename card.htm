<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My car visit-card</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
    background: #111;

    /* ФОН: замените bg.jpg на своё имя файла */
    background-image: url("bg.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
  }

  /* Затемнение фона, чтобы текст читался */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    z-index: 0;
  }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    background: rgba(255, 255, 255, 0.04);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 24px;
    padding: 28px 20px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
  }

  /* АВАТАРКА: замените avatar.jpg на своё имя файла */
  .avatar {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    margin: 0 auto 16px;
    background-image: url("avatar.jpg");
    background-size: cover;
    background-position: center;
    border: 3px solid rgba(255, 255, 255, 0.6);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
  }

  h1 { font-size: 24px; margin: 0 0 8px; }
  p  { color: #e5e7eb; margin: 0 0 24px; font-size: 15px; }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 16px;
    margin-bottom: 12px;
    border-radius: 14px;
    text-decoration: none;
    font-size: 17px;
    font-weight: 600;
    color: #fff;
    transition: transform 0.15s, opacity 0.15s;
  }
  .btn:active { transform: scale(0.98); }
  .btn:hover  { opacity: 0.9; }

  .ig    { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
  .tg    { background: #229ED9; }
  .vk    { background: #0077FF; }
  .phone { background: #22c55e; }
</style>
</head>
<body>
  <div class="card">
    <div class="avatar"></div>
    <h1>Amir Rakhimov</h1>
    <p>Свяжитесь со мной удобным способом</p>

    <a class="btn ig" href="https://instagram.com/r_amirrr_r" target="_blank" rel="noopener">
      📸 Instagram
    </a>

    <a class="btn tg" href="https://t.me/Amirch_EG" target="_blank" rel="noopener">
      ✈️ Telegram
    </a>

    <a class="btn vk" href="https://vk.com/tvoyizik" target="_blank" rel="noopener">
      💙 ВКонтакте
    </a>

    <a class="btn phone" href="tel:+79141955127">
      📞 Позвонить
    </a>
  </div>
</body>
</html>
